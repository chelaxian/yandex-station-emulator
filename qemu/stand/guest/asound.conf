# MIDI rootfs (4ch 96k + mics) adapted to the QEMU VirtIO sound card.
pcm.!default {
    type asym
    playback.pcm "speakers"
    capture.pcm "mics"
}
pcm.speakers {
    type plug
    slave.pcm "hw:0,0"
    slave.channels 2
    slave.rate 48000
    slave.format S16_LE
}
pcm.mixer {
    type plug
    slave.pcm "speakers"
}
pcm.ultrasound {
    type plug
    slave.pcm "speakers"
}
pcm.bluetooth {
    type plug
    slave.pcm "speakers"
}
pcm.mics {
    type plug
    slave.pcm {
        type file
        slave.pcm "null"
        file "/dev/null"
        infile "/tmp/mac-microphone.pcm"
    }
    slave.channels 2
    slave.rate 48000
    slave.format S16_LE
}
pcm.loopback {
    type plug
    slave.pcm "null"
}
ctl.!default {
    type hw
    card 0
}
