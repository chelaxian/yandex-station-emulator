# Adapt the firmware's six-channel interface to the QEMU VirtIO PCM device.
pcm.!default {
    type asym
    playback.pcm "mini2_playback"
    capture.pcm "mini2_capture"
}
pcm.mini2_playback {
    type softvol
    slave.pcm "mini2_output"
    control {
        name "Master Playback Volume"
        card 0
    }
}
pcm.mini2_output {
    type plug
    slave.pcm {
        type dmix
        ipc_key 1024
        slave {
            pcm "hw:0,0"
            channels 2
            rate 48000
        }
    }
}
pcm.mini2_capture {
    type plug
    slave.pcm {
        type file
        slave.pcm "null"
        file "/dev/null"
        infile "/tmp/mac-microphone.pcm"
    }
    slave.channels 2
    slave.rate 48000
    slave.format S16_LE
}
ctl.!default {
    type hw
    card 0
}
